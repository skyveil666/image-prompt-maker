<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6d28d9"/>
      <stop offset="50%"  stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="18" fill="url(#shine)" clip-path="url(#clip)"/>

  <!-- Viewfinder corners — small version -->
  <path d="M4 10 L4 4 L10 4"  stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  <path d="M28 10 L28 4 L22 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>

  <!-- IPM text -->
  <text
    x="16" y="22"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="11"
    fill="white"
    text-anchor="middle"
    letter-spacing="1"
  >IPM</text>

  <!-- Bottom prompt line -->
  <line x1="7" y1="27" x2="25" y2="27" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.28"/>
</svg>
